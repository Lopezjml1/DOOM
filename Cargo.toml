[workspace]
members = ["doom-wad", "doom-core", "doom-render-soft", "doom-platform-win", "doom-bin"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-2.0"
description = "DOOM 1.10 ported to Rust for Windows 11"
rust-version = "1.75"

[workspace.dependencies]
sdl2 = { version = "0.37", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1.5"
thiserror = "2.0"
bitflags = "2.6"
dirs = "6.0"

[profile.release]
opt-level = 2
lto = "thin"

[profile.dev]
opt-level = 1
